<!doctype html><html lang="nl"><head><meta charset=utf8><meta name="robots" content="noindex, nofollow"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Examentrainer Alien</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: één kolom (max 980px). Overzicht = examenkaart + onderwerpenlijst per kerntaak; toets = vaste balk met voortgang, vraagkaart, vraagnummerraster. */
:root {
  --bg: #eef2ee;
  --surface: #ffffff;
  --sunk: #e3e9e4;
  --ink: #15221d;
  --muted: #56675f;
  --line: #d3dcd5;
  --accent: #155e4f;
  --accent-ink: #ffffff;
  --accent-soft: #d8eae3;
  --good: #23743a;
  --good-soft: #dcefe0;
  --bad: #b42318;
  --bad-soft: #f8e1de;
  --flag: #a8610c;
  --flag-soft: #f6e8d3;
  --organ: #c9d3cc;
  --organ-line: #8fa198;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1412; --surface: #16201c; --sunk: #1d2925; --ink: #e5ece8; --muted: #9db0a6; --line: #2a3a34;
    --accent: #63c3a8; --accent-ink: #072019; --accent-soft: #1a3a31;
    --good: #72c47f; --good-soft: #17331f; --bad: #f0786c; --bad-soft: #3a1a17; --flag: #e3a24f; --flag-soft: #3a2a14;
    --organ: #2f3e38; --organ-line: #6f857b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #16201c; --sunk: #1d2925; --ink: #e5ece8; --muted: #9db0a6; --line: #2a3a34;
  --accent: #63c3a8; --accent-ink: #072019; --accent-soft: #1a3a31;
  --good: #72c47f; --good-soft: #17331f; --bad: #f0786c; --bad-soft: #3a1a17; --flag: #e3a24f; --flag-soft: #3a2a14;
  --organ: #2f3e38; --organ-line: #6f857b; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 22px; font-weight: 800; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.02em; }
.muted { color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { min-height: 34px; padding: 4px 12px; font-size: 14px; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Header */
.top { display: flex; flex-direction: column; gap: 6px; margin-bottom: 28px; }
.top .mono { color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
.top p { max-width: 62ch; color: var(--muted); }

/* Exam cards */
.modes { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 36px; }
@media (max-width: 720px) { .modes { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card.exam { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.card.exam .facts dt { color: inherit; opacity: .75; }
.card.exam .btn { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0; }
@media (max-width: 480px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.facts div { display: flex; flex-direction: column; }
.facts dt { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.facts dd { margin: 0; font-family: var(--f-display); font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.side-modes { display: flex; flex-direction: column; gap: 16px; }

/* Topic list */
.section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin: 34px 0 12px; }
.kt { margin-top: 18px; }
.kt-label { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; padding: 0 2px 6px; border-bottom: 1px solid var(--line); }
.topic { display: grid; grid-template-columns: 128px minmax(0, 1fr) 130px auto; gap: 12px; align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--line); }
.topic .code { font-family: var(--f-mono); font-size: 12px; color: var(--accent); }
.topic .name { font-weight: 700; }
.topic .meta { font-size: 13px; color: var(--muted); }
.topic .acts { display: flex; gap: 6px; justify-content: flex-end; }
@media (max-width: 640px) { .topic { grid-template-columns: minmax(0, 1fr) auto; } .topic .code { grid-column: 1 / -1; } .topic .best { grid-column: 1 / -1; } }
.best { display: flex; align-items: center; gap: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; min-width: 40px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar.good i { background: var(--good); }
.bar.bad i { background: var(--bad); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--sunk); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.ok { background: var(--accent-soft); color: var(--accent); }

.history { display: flex; flex-direction: column; }
.history .h { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); align-items: center; font-variant-numeric: tabular-nums; }
.note { font-size: 14px; color: var(--muted); max-width: 70ch; margin-top: 28px; display: flex; flex-direction: column; gap: 6px; }

/* Quiz */
.qbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px; border-bottom: 1px solid var(--line); margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
.qbar .row { justify-content: space-between; }
.progress { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.timer { font-family: var(--f-mono); font-size: 15px; font-variant-numeric: tabular-nums; padding: 4px 10px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
.timer.low { color: var(--bad); border-color: var(--bad); }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tag { font-family: var(--f-mono); font-size: 11px; padding: 3px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.tag.type { background: var(--sunk); color: var(--muted); }
.qtext { font-size: 19px; font-weight: 700; max-width: 62ch; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; width: 100%; padding: 12px 14px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .key { font-family: var(--f-mono); font-size: 13px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .key { background: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .key { background: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); color: var(--surface); }
.opt[disabled] { cursor: default; }
.order { display: flex; flex-direction: column; gap: 8px; }
.oitem { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); }
.oitem .n { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.oitem .mv { display: flex; gap: 4px; }
.oitem .mv button { width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--line); background: var(--sunk); }
.oitem.right { border-color: var(--good); background: var(--good-soft); }
.oitem.wrong { border-color: var(--bad); background: var(--bad-soft); }
.numin { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.numin input { font: inherit; font-size: 20px; font-variant-numeric: tabular-nums; width: 160px; max-width: 100%; padding: 8px 12px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.numin input:focus { border-color: var(--accent); outline: none; }
.hotwrap { overflow-x: auto; }
.hotwrap svg { width: 100%; max-width: 640px; height: auto; display: block; }
.hotwrap [data-hot] { fill: var(--organ); stroke: var(--organ-line); stroke-width: 1.5; cursor: pointer; transition: fill .12s; }
.hotwrap [data-hot]:hover { fill: var(--accent-soft); stroke: var(--accent); }
.hotwrap [data-hot].sel { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 3; }
.hotwrap [data-hot].right { fill: var(--good-soft); stroke: var(--good); stroke-width: 3; }
.hotwrap [data-hot].wrong { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 3; }
.hotwrap .body { fill: var(--sunk); stroke: var(--organ-line); stroke-width: 2; }
.hotwrap .lbl { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }
.feedback { border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.feedback.good { background: var(--good-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback strong { font-family: var(--f-display); font-size: 17px; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.qnav { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-top: 18px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; margin-top: 22px; }
.grid button { height: 38px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface); font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.grid button.done { background: var(--accent-soft); border-color: var(--accent-soft); }
.grid button.flag { border-color: var(--flag); background: var(--flag-soft); }
.grid button.cur { outline: 2.5px solid var(--accent); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1.5px solid var(--line); }
.legend .l-done::before { background: var(--accent-soft); border-color: var(--accent-soft); }
.legend .l-flag::before { background: var(--flag-soft); border-color: var(--flag); }
.confirm { background: var(--surface); border: 1.5px solid var(--accent); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }

/* Results */
.score { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; }
@media (max-width: 560px) { .score { grid-template-columns: 1fr; } }
.big { font-family: var(--f-display); font-weight: 800; font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: 26px; color: var(--muted); }
.cesuur { position: relative; height: 12px; background: var(--sunk); border-radius: 6px; margin-top: 26px; }
.cesuur i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--accent); }
.cesuur .mark { position: absolute; top: -22px; transform: translateX(-50%); font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.cesuur .mark::after { content: ""; position: absolute; left: 50%; top: 18px; width: 2px; height: 16px; background: var(--ink); opacity: .5; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 15px; vertical-align: middle; }
th { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
td.code { font-family: var(--f-mono); font-size: 12px; color: var(--accent); white-space: nowrap; }
td.barcell { width: 30%; min-width: 90px; }
.review { display: flex; flex-direction: column; gap: 12px; }
.ritem { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--good); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.ritem.bad { border-left-color: var(--bad); }
.ritem .q { font-weight: 700; }
.ritem .a { font-size: 14px; }
.ritem .e { font-size: 14px; color: var(--muted); }
.toggle { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; }
.toggle button { border: 0; background: transparent; padding: 6px 14px; font-size: 14px; font-weight: 700; }
.toggle button.on { background: var(--accent); color: var(--accent-ink); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
// Vragenbank deel 1. Bij meerkeuze staat het juiste antwoord altijd eerst; de volgorde wordt bij tonen gehusseld.
const Q = [];
function M(b, q, o, e) { Q.push({ b, t: "mc", q, o, e }); }
function O(b, q, o, e) { Q.push({ b, t: "order", q, o, e }); }
function N(b, q, a, tol, unit, e) { Q.push({ b, t: "num", q, a, tol, unit, e }); }
function H(b, q, a, e) { Q.push({ b, t: "hot", q, a, e }); }

/* ---------- B1-K1 1 Anatomie en fysiologie ---------- */
M("anat", "Hoeveel halswervels heeft een paard?", ["7", "6", "18"], "Alle zoogdieren hebben 7 halswervels, ook het paard en de giraffe. 18 is het aantal borstwervels van het paard.");
M("anat", "Hoe heet de eerste halswervel (C1)?", ["Atlas", "Axis (draaier)", "Os sacrum"], "C1 is de atlas (ja-knikken), C2 de axis of draaier (nee-schudden).");
M("anat", "Welke beweging maakt het gewricht tussen atlas en axis mogelijk?", ["Nee-schudden (draaien van de kop)", "Ja-knikken", "Buigen en strekken van de rug"], "Atlas-axis is het enige draaigewricht: de atlas draait om het tandvormige uitsteeksel van de axis. Ja-knikken gebeurt tussen schedel en atlas.");
M("anat", "Uit welke drie botstukken bestaat elk heupbeen?", ["Os ilium, os ischium en os pubis", "Os sacrum, os ilium en femur", "Os pubis, patella en tibia"], "Darmbeen (ilium), zitbeen (ischium) en schaambeen (pubis). Samen met het os sacrum vormen de twee heupbeenderen het bekken.");
M("anat", "Wat is de patella?", ["Een sesambeen in de eindpees van de kniestrekker", "Een meniscus tussen femur en tibia", "Een kruisband in het kniegewricht"], "De knieschijf is een verbeend peesdeel (sesambeen) dat in de trochlea van het femur glijdt.");
M("anat", "Welk soort gewricht is het heupgewricht?", ["Kogelgewricht", "Scharniergewricht", "Draaigewricht"], "Heup en schouder zijn kogelgewrichten; elleboog, knie en teenkootjes zijn scharniergewrichten.");
M("anat", "Hoe is het voorbeen van hond en kat met de romp verbonden?", ["Halfstar, via spieren (geen sleutelbeen)", "Star, via een vergroeiing", "Via een kogelgewricht met het borstbeen"], "De romp hangt als het ware tussen de voorbenen in spieren: een halfstarre verbinding.");
M("anat", "Welk hormoon uit de bijschildklier verhoogt het calciumgehalte in het bloed?", ["Parathormoon (PTH)", "Calcitonine", "Insuline"], "PTH (bijschildklier) en actief vitamine D verhogen calcium; calcitonine uit de schildklier verlaagt het.");
M("anat", "Welk dier heeft geen galblaas?", ["Paard", "Hond", "Kat"], "Bij het paard gaat de gal direct naar het duodenum.");
M("anat", "Waar monden de afvoergangen van lever en pancreas uit?", ["In het duodenum", "In het jejunum", "In het ileum"], "Vlak na de maaguitgang, in het eerste deel van het duodenum.");
M("anat", "Welk pancreasenzym verteert vetten?", ["Lipase", "Trypsine", "Amylase"], "Lipase splitst vet, trypsine eiwit en amylase zetmeel/koolhydraten.");
M("anat", "Hoe is het bloed in de poortader?", ["Zuurstofarm en rijk aan voedingsstoffen", "Zuurstofrijk en arm aan voedingsstoffen", "Zuurstofrijk en rijk aan voedingsstoffen"], "De poortader brengt bloed uit darm en milt naar de lever. Zuurstof krijgt de lever via de a. hepatica.");
M("anat", "Wat doet de dikke darm vooral?", ["Water en zouten opnemen; bacteriën maken vitamine B en K", "Eiwitten verteren met pepsine", "Gal produceren voor de vetvertering"], "In de dikke darm worden geen verteringssappen meer gemaakt.");
M("anat", "Wat is caecotrofie bij het konijn?", ["Het direct van de anus opeten van blindedarmkeutels", "Het opeten van ontlasting van andere dieren", "Het herkauwen van voer"], "Caecotrofen bevatten eiwit en vitamine B en K uit de blinde darm. Coprofagie is een foute benaming.");
M("anat", "Welk verschil heeft het speeksel van hond en kat met dat van de mens en herkauwers?", ["Het bevat geen verteringsenzymen", "Het bevat extra pepsine", "Het bevat galzouten"], "Bij hond en kat begint de vertering pas in de maag.");
M("anat", "Waarom kan een cavia niet zonder vitamine C uit het voer?", ["Hij kan het zelf niet aanmaken", "Hij scheidt het via caecotrofie uit", "Het wordt in de pens afgebroken"], "Cavia's maken geen vitamine C aan; ze hebben groente, fruit of gesupplementeerde brok nodig.");
M("anat", "In welk deel van de maag van het rund vindt de microbiële gisting vooral plaats? [aanvulling]", ["Pens", "Boekmaag", "Lebmaag"], "De pens is de grootste voormaag; de lebmaag is de echte maag met enzymen. Dit onderdeel staat niet in de lesstof.");
M("anat", "Welke hartklep ligt tussen linkerboezem en linkerkamer?", ["Mitralisklep (tweeslippig)", "Tricuspidaalklep", "Pulmonaalklep"], "Rechts zit de tricuspidaalklep; de pulmonaal- en aortaklep zitten tussen kamer en slagader.");
M("anat", "Waar begint de prikkel voor de hartslag?", ["In de sinusknoop in de wand van de rechterboezem", "In de AV-knoop", "In de bundel van His"], "Sinusknoop → AV-knoop → bundel van His → purkinjevezels.");

M("anat", "Waar voel je bij de hond de pols?", ["Aan de binnenkant van het achterbeen (a. femoralis)", "Aan het voorbeen (v. cephalica)", "In de hals (v. jugularis)"], "De v. cephalica en v. jugularis zijn aders, gebruikt voor bloedafname.");

  db.doc("scores/" + uid).onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    if (snap.exists) {
      const d = snap.data() || {};
      const remote = { runs: [...(d.runs || [])], best: { ...(d.best || {}) }, wrong: [...(d.wrong || [])] };
      if (first) {
        const merged = mergeStores(remote, store);
        const changed = merged.runs.length !== remote.runs.length || merged.wrong.length !== remote.wrong.length || JSON.stringify(merged.best) !== JSON.stringify(remote.best);
        store = merged; saveLocal(); if (changed) pushCloud();
      } else { store = remote; saveLocal(); }
    } else if (first && (store.runs.length || store.wrong.length)) pushCloud();
    first = false;
    if (S.view === "home") render();
  }, () => {});
  db.collection("scores").onSnapshot(async snap => {
    cloud.people = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...(d.data() || {}) }));
    try {
      const ps = await user.profiles(cloud.people.map(p => p.id));
      cloud.names = Object.fromEntries(Object.entries(ps).map(([k, v]) => [k, v.isMe ? "Jij" : (v.name || "Iemand")]));
    } catch (e) {}
    if (S.view === "home") render();
  }, () => {});
  if (S.view === "home") render();
}
function progressHtml() {
  const people = cloud.people.filter(p => (p.runs || []).length);
  if (!people.length) return "";
  people.sort((a, b) => (a.id === cloud.uid ? -1 : b.id === cloud.uid ? 1 : (b.updated || 0) - (a.updated || 0)));
  const rows = people.map(p => {
    const runs = p.runs || [], exams = runs.filter(r => r.mode === "exam");
    const last = exams[0], best = exams.reduce((m, r) => (!m || r.good > m.good ? r : m), null);
    const pill = r => r ? `<span class="pill ${r.good >= GOOD ? "good" : r.good >= PASS ? "ok" : "bad"}">${r.good}/65</span>` : `<span class="muted">-</span>`;
    const weak = Object.entries(p.best || {}).filter(([, v]) => v < 60).map(([k]) => BY[k] && BY[k].name).filter(Boolean);
    return `<tr><td><strong>${esc(cloud.names[p.id] || (p.id === cloud.uid ? "Jij" : "Iemand"))}</strong></td><td>${runs.length}</td><td>${exams.length}</td><td>${pill(last)}</td><td>${pill(best)}</td>

}
function storageLabel() {
  if (cloud.state === "on") return "Opgeslagen in je account";
  if (cloud.state === "readonly") return "Alleen in deze browser opgeslagen: je hebt geen schrijfrechten op deze pagina";
  return "Opgeslagen in deze browser";

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pct = (g, t) => t ? Math.round(g / t * 100) : 0;
const fmtTime = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); return String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
const fmtDate = t => new Date(t).toLocaleString("nl-NL", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

/* ---------- vragen klaarzetten ---------- */
function prep(q) {
  const item = { id: q.id, answer: null, touched: false, checked: false };
  if (q.t === "mc") item.perm = shuffle(q.o.map((_, i) => i));
  if (q.t === "order") { let p; do { p = shuffle(q.o.map((_, i) => i)); } while (p.every((v, i) => v === i) && q.o.length > 1); item.answer = p; }
  return item;
}
function buildExam() {
  const used = new Set(), list = [];
  for (const b of BLOCKS) {
    const pool = Q.filter(q => q.b === b.id);
    const pick = [];
    for (const k of b.special) { const c = shuffle(pool.filter(q => q.kind === k && !used.has(q.id)))[0]; if (c) { pick.push(c); used.add(c.id); } }
    const rest = shuffle(pool.filter(q => q.kind === "mc3" && !used.has(q.id)));
    while (pick.length < b.q && rest.length) { const c = rest.shift(); pick.push(c); used.add(c.id); }
    list.push(...pick);
  }
  return shuffle(list);
}
function buildMix(n) {
  const slots = shuffle(BLOCKS.flatMap(b => Array(b.q).fill(b.id))).slice(0, n);
  const used = new Set(), list = [];
  for (const bid of slots) { const c = shuffle(Q.filter(q => q.b === bid && !used.has(q.id)))[0]; if (c) { used.add(c.id); list.push(c); } }
  return list;
}

/* ---------- toestand ---------- */
let S = { view: "home" };
let tick = null;

function startRun(mode, title, questions) {
  S = { view: "quiz", mode, title, items: questions.map(prep), i: 0, flags: {}, started: Date.now(), confirm: false, deadline: mode === "exam" ? Date.now() + EXAM_MIN * 60000 : null };
  startTimer(); render(); window.scrollTo(0, 0);
}
function startTimer() {
  clearInterval(tick);
  if (!S.deadline) return;
  tick = setInterval(() => {
    const el = document.getElementById("timer");
    const left = (S.deadline - Date.now()) / 1000;
    if (left <= 0) { clearInterval(tick); finish(true); return; }
    if (el) { el.textContent = fmtTime(left); el.classList.toggle("low", left < 600); }
  }, 1000);
}

/* ---------- beoordelen ---------- */
function isCorrect(q, it) {
  if (it.answer === null || it.answer === undefined || it.answer === "") return false;
  if (q.t === "mc") return it.answer === 0;
  if (q.t === "order") return it.touched && it.answer.every((v, i) => v === i);
  if (q.t === "num") { const v = parseFloat(String(it.answer).replace(",", ".")); return !isNaN(v) && Math.abs(v - q.a) <= q.tol; }
  if (q.t === "hot") return it.answer === q.a;
  return false;
}
function answered(q, it) { return q.t === "order" ? it.touched : (it.answer !== null && it.answer !== ""); }
function answerText(q, it) {
  if (!answered(q, it)) return "Niet beantwoord";
  if (q.t === "mc") return q.o[it.answer];
  if (q.t === "order") return it.answer.map(i => q.o[i]).join(" → ");
  if (q.t === "num") return it.answer + " " + q.unit;
  if (q.t === "hot") return ORGANS[it.answer] || it.answer;
}
function rightText(q) {
  if (q.t === "mc") return q.o[0];
  if (q.t === "order") return q.o.join(" → ");
  if (q.t === "num") return String(q.a).replace(".", ",") + " " + q.unit;
  if (q.t === "hot") return ORGANS[q.a];
}

function finish(timeUp) {
  clearInterval(tick);
  const res = { blocks: {}, good: 0, total: S.items.length };
  const review = [];
  for (const it of S.items) {
    const q = QI[it.id], ok = isCorrect(q, it);
    res.blocks[q.b] = res.blocks[q.b] || [0, 0];
    res.blocks[q.b][1]++;
    if (ok) { res.good++; res.blocks[q.b][0]++; }
    review.push({ id: it.id, ok, given: answerText(q, it) });
    const w = store.wrong.indexOf(it.id);
    if (ok && w >= 0) store.wrong.splice(w, 1);
    if (!ok && w < 0) store.wrong.push(it.id);
  }
  for (const [b, [g, t]] of Object.entries(res.blocks)) {
    if (S.mode === "topic" || S.mode === "exam") { const p = pct(g, t); if (t >= 3 && (store.best[b] === undefined || p > store.best[b])) store.best[b] = p; }
  }
  store.runs.unshift({ mode: S.mode, title: S.title, date: Date.now(), good: res.good, total: res.total, secs: Math.round((Date.now() - S.started) / 1000) });
  store.runs = store.runs.slice(0, 50);
  save();
  S = { view: "result", mode: S.mode, title: S.title, res, review, timeUp, secs: Math.round((Date.now() - S.started) / 1000), filter: "all" };
  render(); window.scrollTo(0, 0);
}

  </article>
  ${nav}
  ${S.stopAsk ? `<div class="confirm"><strong>Stoppen zonder resultaat?</strong><span>Je antwoorden worden niet bewaard.</span><div class="row"><button class="btn primary" data-act="reallystop">Stoppen</button><button class="btn" data-act="nostop">Verder oefenen</button></div></div>` : ""}`;
}

function resultHtml() {
  const R = S.res, p = pct(R.good, R.total), exam = S.mode === "exam";
  let verdict, vcls;
  if (exam) { if (R.good >= GOOD) { verdict = "Goed"; vcls = "good"; } else if (R.good >= PASS) { verdict = "Voldoende"; vcls = "ok"; } else { verdict = "Onvoldoende"; vcls = "bad"; } }
  else { verdict = p >= 80 ? "Goed bezig" : p >= 60 ? "Voldoende" : "Nog oefenen"; vcls = p >= 80 ? "good" : p >= 60 ? "ok" : "bad"; }
  const passPos = pct(PASS, 65), goodPos = pct(GOOD, 65);
  const rows = BLOCKS.filter(b => R.blocks[b.id]).map(b => {
    const [g, t] = R.blocks[b.id], bp = pct(g, t);
    return `<tr><td class="code">${esc(b.code)}</td><td>${esc(b.name)}</td><td>${g}/${t}</td><td class="barcell"><div class="best"><div class="bar ${bp >= 80 ? "good" : bp < 60 ? "bad" : ""}"><i style="width:${bp}%"></i></div><span>${bp}%</span></div></td>
      <td><button class="btn small ghost" data-act="topic" data-b="${b.id}" data-n="10">Oefen</button></td></tr>`;
  }).join("");
  const wrongs = S.review.filter(r => !r.ok);
  const list = (S.filter === "wrong" ? wrongs : S.review).map(r => {
    const q = QI[r.id];
    return `<div class="ritem ${r.ok ? "" : "bad"}"><span class="tag" style="align-self:flex-start">${esc(BY[q.b].code)}</span><span class="q">${esc(q.q)}</span>
      <span class="a">Jouw antwoord: ${esc(r.given)}${r.ok ? " ✓" : ""}</span>${r.ok ? "" : `<span class="a">Juist: <b>${esc(rightText(q))}</b></span>`}${q.e ? `<span class="e">${esc(q.e)}</span>` : ""}</div>`;
  }).join("");
  return `
  <header class="top"><span class="mono">${exam ? "Uitslag proeftoets" : "Resultaat"}</span><h1>${esc(S.title)}</h1>${S.timeUp ? `<p>De tijd van 90 minuten was om; de toets is automatisch ingeleverd.</p>` : ""}</header>
  <section class="score">
    <div class="big">${R.good}<small>/${R.total}</small></div>
    <div class="stack" style="gap:8px">
      <div class="row"><span class="pill ${vcls}">${verdict}</span><span class="muted">${p}% goed · tijd ${fmtTime(S.secs)}</span></div>
      ${exam ? `<div class="cesuur" aria-label="Score ten opzichte van de cesuur"><i style="width:${p}%"></i><span class="mark" style="left:${passPos}%">39 voldoende</span><span class="mark" style="left:${goodPos}%">52 goed</span></div>` : `<p class="muted">Op het examen heb je 60% nodig voor een voldoende en 80% voor goed.</p>`}
    </div>
  </section>
  <div class="section-head"><h2>Per onderdeel</h2></div>
  <div class="tablewrap"><table><thead><tr><th>Code</th><th>Onderwerp</th><th>Goed</th><th>Score</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="row" style="margin-top:20px">
    ${wrongs.length ? `<button class="btn primary" data-act="redo">Oefen de ${wrongs.length} foute vragen</button>` : ""}
    <button class="btn" data-act="home">Naar het overzicht</button>
  </div>
  <div class="section-head"><h2>Nakijken</h2><div class="toggle"><button class="${S.filter === "all" ? "on" : ""}" data-act="filter" data-f="all">Alle vragen</button><button class="${S.filter === "wrong" ? "on" : ""}" data-act="filter" data-f="wrong">Alleen fout (${wrongs.length})</button></div></div>
  <div class="review">${list || `<p class="muted">Geen foute vragen. Mooi!</p>`}</div>`;
}

/* ---------- interactie ---------- */
document.addEventListener("click", e => {
  const hot = e.target.closest("[data-hot]");
  if (hot && S.view === "quiz") { pickHot(hot.getAttribute("data-hot")); return; }
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const a = el.dataset.act;
  if (a === "exam") startRun("exam", "Proeftoets kennisexamen", buildExam());
  else if (a === "mix") startRun("mix", "Snelle mix", buildMix(20));
  else if (a === "wrong") startRun("wrong", "Foutenlijst", shuffle(store.wrong.map(id => QI[id]).filter(Boolean)));
  else if (a === "topic") {
    const b = BY[el.dataset.b]; let pool = shuffle(Q.filter(q => q.b === b.id));
    if (el.dataset.n !== "all") pool = pool.slice(0, 10);
    startRun("topic", b.name, pool);
  }
  else if (a === "reset") { store = { runs: [], best: {}, wrong: [] }; save(); render(); }
  else if (a === "home") { S = { view: "home" }; render(); window.scrollTo(0, 0); }
  else if (a === "filter") { S.filter = el.dataset.f; render(); }
  else if (a === "redo") { const ids = S.review.filter(r => !r.ok).map(r => QI[r.id]); startRun("wrong", "Foute vragen", shuffle(ids)); }
  else if (S.view === "quiz") quizAct(a, el);
});
document.addEventListener("keydown", e => {
  const hot = e.target.closest && e.target.closest("[data-hot]");
  if (hot && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pickHot(hot.getAttribute("data-hot")); }
});
document.addEventListener("input", e => {
  if (S.view !== "quiz" || !e.target.id || !e.target.id.startsWith("num-")) return;
  const it = S.items[S.i]; it.answer = e.target.value.trim();
  if (S.mode === "exam") { const g = document.querySelector(".grid button.cur"); if (g) g.classList.toggle("done", it.answer !== ""); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id && e.target.id.startsWith("num-") && S.mode !== "exam") quizAct("check");
});

function pickHot(k) {
  const it = S.items[S.i], q = QI[it.id];
  if (q.t !== "hot" || (S.mode !== "exam" && it.checked)) return;
  it.answer = k;
  if (S.mode !== "exam") it.checked = true;
  render();
}
function quizAct(a, el) {
  const it = S.items[S.i], q = QI[it.id], exam = S.mode === "exam";
  if (a === "pick") { if (!exam && it.checked) return; it.answer = +el.dataset.v; if (!exam) it.checked = true; render(); return; }
  if (a === "up" || a === "down") {
    const k = +el.dataset.k, j = a === "up" ? k - 1 : k + 1;
    [it.answer[k], it.answer[j]] = [it.answer[j], it.answer[k]]; it.touched = true; render(); return;
  }
  if (a === "lock") { it.touched = true; render(); return; }
  if (a === "check") {
    if (q.t === "num" && (it.answer === null || it.answer === "")) { const i = document.getElementById("num-" + it.id); if (i) i.focus(); return; }
    if (q.t === "order") it.touched = true;
    it.checked = true; render(); return;
  }
  if (a === "nextp") { if (S.i < S.items.length - 1) { S.i++; render(); window.scrollTo(0, 0); } else finish(false); return; }
  if (a === "next") { if (S.i < S.items.length - 1) { S.i++; S.confirm = false; render(); window.scrollTo(0, 0); } return; }
  if (a === "prev") { if (S.i > 0) { S.i--; S.confirm = false; render(); window.scrollTo(0, 0); } return; }
  if (a === "go") { S.i = +el.dataset.k; S.confirm = false; render(); return; }
  if (a === "flag") { S.flags[S.i] = !S.flags[S.i]; render(); return; }
  if (a === "submit") { S.confirm = true; render(); return; }
  if (a === "nosubmit") { S.confirm = false; render(); return; }
  if (a === "really") { finish(false); return; }
  if (a === "stop") { S.stopAsk = true; render(); return; }
  if (a === "nostop") { S.stopAsk = false; render(); return; }
  if (a === "reallystop") { clearInterval(tick); S = { view: "home" }; render(); window.scrollTo(0, 0); return; }
}

/* ---------- start (bewaart een lopende toets bij een update van de pagina) ---------- */
function boot(data) {
  if (data && data.S) { S = data.S; if (S.view === "quiz") startTimer(); }
  render();
  initCloud();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

</body></html>
